[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-xai"
version = "0.2.0"
description = "Explainable, drift-aware and fairness-checked fraud screening on the Bank Account Fraud dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Utku Fidan" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "catboost>=1.2",
  "optuna>=3.6",
  "scipy>=1.11",
  "shap>=0.45",
  "matplotlib>=3.8",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fraud-xai = "fraud_xai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
